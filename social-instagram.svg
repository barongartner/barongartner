<rect width="600" height="160" fill="url(#instagram-bg)"/>
<rect width="600" height="160" fill="url(#instagram-glow)"/>
<rect x="32" y="32" width="96" height="96" rx="24" fill="url(#instagram-icon)" filter="url(#instagram-ds)"/>
<rect x="32" y="32" width="96" height="96" rx="24" fill="url(#instagram-sheen)"/>
<rect x="32.6" y="32.6" width="94.8" height="94.8" rx="23.4" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
<rect x="58" y="58" width="44" height="44" rx="13" fill="none" stroke="#fff" stroke-width="6"/><circle cx="80" cy="80" r="11" fill="none" stroke="#fff" stroke-width="6"/><circle cx="95" cy="65" r="3.6" fill="#fff"/>
