<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Instagram — @barongartner">
<defs>
<linearGradient id="instagram-bg" x1="0" y1="0" x2="600" y2="160" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#13131a"/><stop offset="1" stop-color="#1c182c"/></linearGradient>
<radialGradient id="instagram-glow" cx="80" cy="80" r="150" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#d62976" stop-opacity="0.20"/><stop offset="1" stop-color="#d62976" stop-opacity="0"/></radialGradient>
<clipPath id="instagram-clip"><rect x="32" y="32" width="96" height="96" rx="24"/></clipPath>
<linearGradient id="instagram-title" x1="0" y1="60" x2="0" y2="92" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7d7e2"/></linearGradient>
<filter id="instagram-ds" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
<feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/></filter>
<linearGradient id="ig-badge" x1="106" y1="136" x2="134" y2="104" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#feda75"/><stop offset="0.3" stop-color="#fa7e1e"/><stop offset="0.6" stop-color="#d62976"/><stop offset="1" stop-color="#962fbf"/></linearGradient>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}</style>
</defs>
<rect width="600" height="160" fill="url(#instagram-bg)"/>
<rect width="600" height="160" fill="url(#instagram-glow)"/>
<g filter="url(#instagram-ds)">
<image xlink:href="data:image/jpeg;base64," x="32" y="32" width="96" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#instagram-clip)"/>
</g>
<rect x="32" y="32" width="96" height="96" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
<circle cx="120" cy="120" r="20" fill="#14121b"/>
<circle cx="120" cy="120" r="16.5" fill="url(#ig-badge)"/><rect x="111" y="111" width="18" height="18" rx="5.5" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="120" cy="120" r="4.4" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="126.2" cy="113.8" r="1.5" fill="#fff"/>
<text x="152" y="82" font-size="42" font-weight="800" letter-spacing="-1" fill="url(#instagram-title)">Instagram</text>
<text x="154" y="116" font-size="23" font-weight="500" fill="#8b8b9a">@barongartner</text>
</svg>