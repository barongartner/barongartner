<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instagram — @barongartner">
<defs>
<linearGradient id="instagram-bg" x1="0" y1="0" x2="600" y2="160" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#13131a"/><stop offset="1" stop-color="#1c182c"/></linearGradient>
<radialGradient id="instagram-glow" cx="80.0" cy="80.0" r="150" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#d62976" stop-opacity="0.22"/><stop offset="1" stop-color="#d62976" stop-opacity="0"/></radialGradient>
<linearGradient id="instagram-icon" x1="32" y1="128" x2="128" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#feda75"/><stop offset="0.25" stop-color="#fa7e1e"/><stop offset="0.5" stop-color="#d62976"/><stop offset="0.75" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
<linearGradient id="instagram-sheen" x1="32" y1="32" x2="84" y2="98" gradientUnits="userSpaceOnUse">
