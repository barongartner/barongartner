<linearGradient id="youtube-icon" x1="32" y1="32" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#cc0000"/></linearGradient>
